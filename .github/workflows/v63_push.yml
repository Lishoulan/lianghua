name: V63 Daily Push

on:
  schedule:
    # 盘前扫描：北京时间14:30 = UTC 06:30（每天）
    - cron: '30 6 * * *'
    # 每日推送：北京时间18:30 = UTC 10:30（每天）
    - cron: '30 10 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  pre-market-scan:
    if: github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache stock data & OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache
            results/oamv_cache
          key: stock-cache-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            stock-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V6.3 Pre-market Scan (Mootdx)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python -m classic_ta.v63_mootdx_push

  daily-push:
    if: github.event.schedule == '30 10 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache stock data & OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache
            results/oamv_cache
          key: stock-cache-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            stock-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V6.3 Daily Push
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python classic_ta/v63_daily_push.py
