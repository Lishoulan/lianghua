name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff duckdb

      - name: Verify duckdb is available
        run: |
          python -c "import duckdb; print(f'duckdb {duckdb.__version__}')"

      - name: Lint with ruff
        run: ruff check classic_ta/ ml_strategy/ wechat_push/ tests/ || true

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=classic_ta \
            --cov=ml_strategy \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ── 冒烟测试：确保 daily_push 入口可正常 import ──
  smoke:
    name: Smoke Test (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import duckdb; print(f'duckdb {duckdb.__version__}')"

      - name: Verify imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from classic_ta.v60_ambush_model import IndicatorCalcBase, DEFAULT_PARAMS
          from classic_ta.v64_ambush_model import V64_PARAMS
          from classic_ta.common.scanner import SyncScanner, apply_dynamic_score_filter
          from classic_ta.common.message_builder import build_push_message
          from ml_strategy.oamv_filter import *
          from wechat_push import check_signature, handle_wechat_event
          print('All imports OK')
          print(f'V64_PARAMS keys: {len(V64_PARAMS)}')
          print(f'DEFAULT_PARAMS keys: {len(DEFAULT_PARAMS)}')
          "
