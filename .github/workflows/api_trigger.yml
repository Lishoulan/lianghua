# API触发工作流 - 由外部定时服务(cron-job.org)通过GitHub API调用
# 解决GitHub Actions原生schedule不可靠的问题（延迟/跳过）
#
# 触发方式:
#   curl -X POST \
#     -H "Authorization: token ghp_xxx" \
#     -H "Accept: application/vnd.github.v3+json" \
#     https://api.github.com/repos/Lishoulan/lianghua/actions/workflows/api_trigger.yml/dispatches \
#     -d '{"ref":"main","inputs":{"job_type":"pre-market"}}'
#
# job_type 取值:
#   pre-market  → 盘前扫描（14:30北京时间）
#   daily-push  → 每日推送（18:30北京时间）

name: API Trigger Push

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: '任务类型: pre-market(盘前扫描) 或 daily-push(每日推送)'
        required: true
        default: 'pre-market'
        type: choice
        options:
          - pre-market
          - daily-push

jobs:
  pre-market-scan:
    if: github.event.inputs.job_type == 'pre-market'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache stock data & OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache
            results/oamv_cache
          key: stock-cache-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            stock-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V6.4.5 Pre-market Scan (Mootdx)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python -m classic_ta.v63_mootdx_push

  daily-push:
    if: github.event.inputs.job_type == 'daily-push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache stock data & OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache
            results/oamv_cache
          key: stock-cache-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            stock-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V6.4.5 Daily Push
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python classic_ta/v63_daily_push.py
