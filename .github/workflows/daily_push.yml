name: Daily Push

on:
  schedule:
    - cron: '15 5 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '50 5 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push)'
        required: false
        default: 'false'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  check-duplicate:
    name: Check if already pushed today
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      time_slot: ${{ steps.check.outputs.time_slot }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPR" in
              "15 5 * * 1-5"|"30 5 * * 1-5"|"50 5 * * 1-5")
                SLOT="intraday"
                ;;
              "15 9 * * 1-5"|"30 9 * * 1-5"|"50 9 * * 1-5")
                SLOT="after_hours"
                ;;
              *)
                SLOT="unknown"
                ;;
            esac
          else
            # workflow_dispatch 手动触发：按北京时间智能判断时段
            # 盘中: 09:15-15:00 (BJ) = 01:15-07:00 (UTC)
            # 盘后: 15:00-23:59 (BJ) = 07:00-15:59 (UTC)
            # 盘前: 00:00-09:15 (BJ) = 16:00-01:15 (UTC) -> 视为 after_hours（用上一交易日数据）
            UTC_HOUR=$(date -u +%H)
            UTC_MIN=$(date -u +%M)
            UTC_MIN_TOTAL=$((UTC_HOUR * 60 + UTC_MIN))

            if [ "$UTC_MIN_TOTAL" -ge 75 ] && [ "$UTC_MIN_TOTAL" -lt 420 ]; then
              # 01:15-07:00 UTC = 09:15-15:00 BJ -> 盘中
              SLOT="intraday"
            else
              # 07:00-01:15 UTC = 15:00-09:15 BJ -> 盘后（含盘前，用上一交易日数据）
              SLOT="after_hours"
            fi
          fi

          echo "time_slot=$SLOT" >> "$GITHUB_OUTPUT"

          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          ARTIFACT_NAME="push-results-${TODAY}-${SLOT}"
          ARTIFACTS=$(
            gh api "repos/${{ github.repository }}/actions/artifacts" \
              --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" \
              2>/dev/null || true
          )

          if [ -n "$ARTIFACTS" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skip ${SLOT}: artifact ${ARTIFACT_NAME} already exists."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Run ${SLOT}: artifact ${ARTIFACT_NAME} not found."
          fi

  daily-push:
    name: Run push
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Log trigger time and detect delay
        id: trigger_info
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          echo "=== Workflow Trigger Info ==="
          echo "Trigger time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Trigger time (Beijing): $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "Time slot: ${{ needs.check-duplicate.outputs.time_slot }}"
          echo "Schedule expression: ${SCHEDULE_EXPR:-manual}"

          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          UTC_MIN_TOTAL=$((UTC_HOUR * 60 + UTC_MIN))

          SLOT="${{ needs.check-duplicate.outputs.time_slot }}"
          if [ "$SLOT" = "intraday" ]; then
            EXPECTED_MIN=315
          elif [ "$SLOT" = "after_hours" ]; then
            EXPECTED_MIN=555
          else
            EXPECTED_MIN=$UTC_MIN_TOTAL
          fi

          DELAY_MIN=$((UTC_MIN_TOTAL - EXPECTED_MIN))
          echo "Delay: ${DELAY_MIN} minutes"
          if [ "$DELAY_MIN" -gt 10 ]; then
            echo "Trigger delayed by ${DELAY_MIN} minutes."
          fi
          echo "delay_minutes=$DELAY_MIN" >> "$GITHUB_OUTPUT"

      - name: Prepare workspace directories
        run: mkdir -p results/daily results/oamv_cache logs

      - name: Get current Beijing date
        id: date
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build unique cache key
        id: cache_meta
        env:
          TIME_SLOT: ${{ needs.check-duplicate.outputs.time_slot }}
        run: |
          SUFFIX="$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M%S')-${TIME_SLOT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "cache_suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Cache suffix: $SUFFIX"

      - name: Cache stock data and OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache.duckdb
            results/oamv_cache
          key: stock-cache-v6-${{ runner.os }}-${{ steps.cache_meta.outputs.cache_suffix }}
          restore-keys: |
            stock-cache-v6-${{ runner.os }}-
            stock-cache-v5-${{ runner.os }}-
            stock-cache-v4-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tradingagents:daily-push
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Daily Push in Docker
        timeout-minutes: 50
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TIME_SLOT: ${{ needs.check-duplicate.outputs.time_slot }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERVERCHAN_KEY_BETA: ${{ secrets.SERVERCHAN_KEY_BETA }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          WECHAT_ENCODING_AES_KEY: ${{ secrets.WECHAT_ENCODING_AES_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
        run: |
          # 走 run_scan_pipeline.py 统一编排：
          #   fetch_today_bars (批量更新当日全市场) → prewarm → freshness → daily_push
          # 主推送阶段：10 次重试 × 60s 间隔（约 10 分钟窗口）
          CMD="python -u scripts/run_scan_pipeline.py --mode ${TIME_SLOT} --retries 10 --base-sleep 60"
          if [ "$DRY_RUN" = "true" ]; then
            CMD="python -u scripts/run_scan_pipeline.py --mode ${TIME_SLOT} --retries 2 --base-sleep 10"
            export DRY_RUN=1
          fi

          docker run --rm --name daily-push \
            -e TUSHARE_TOKEN \
            -e SERVERCHAN_KEY \
            -e SERVERCHAN_KEY_BETA \
            -e WECHAT_APP_ID \
            -e WECHAT_APP_SECRET \
            -e WECHAT_TOKEN \
            -e WECHAT_ENCODING_AES_KEY \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            -e PUSH_API_KEY \
            -e DRY_RUN \
            -v "$GITHUB_WORKSPACE/results:/app/results" \
            -v "$GITHUB_WORKSPACE/logs:/app/logs" \
            tradingagents:daily-push \
            /bin/sh -lc "$CMD"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-results-${{ steps.date.outputs.today }}-${{ needs.check-duplicate.outputs.time_slot }}
          path: results/daily/
          retention-days: 30

  retry-push:
    name: Retry if failed
    needs: [check-duplicate, daily-push]
    if: (failure() || cancelled()) && needs.check-duplicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare workspace directories
        run: mkdir -p results/daily results/oamv_cache logs

      - name: Get current Beijing date
        id: date
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build unique cache key
        id: cache_meta
        env:
          TIME_SLOT: ${{ needs.check-duplicate.outputs.time_slot }}
        run: |
          SUFFIX="$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M%S')-${TIME_SLOT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-retry"
          echo "cache_suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Cache suffix: $SUFFIX"

      - name: Cache stock data and OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache.duckdb
            results/oamv_cache
          key: stock-cache-v6-${{ runner.os }}-${{ steps.cache_meta.outputs.cache_suffix }}
          restore-keys: |
            stock-cache-v6-${{ runner.os }}-
            stock-cache-v5-${{ runner.os }}-
            stock-cache-v4-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tradingagents:daily-push
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry Daily Push in Docker
        timeout-minutes: 50
        env:
          TIME_SLOT: ${{ needs.check-duplicate.outputs.time_slot }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERVERCHAN_KEY_BETA: ${{ secrets.SERVERCHAN_KEY_BETA }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          WECHAT_ENCODING_AES_KEY: ${{ secrets.WECHAT_ENCODING_AES_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
        run: |
          echo "=== Retry push after failure ==="
          echo "Retry time (Beijing): $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"

          # 复用 run_scan_pipeline.py 新鲜度保障 + 降级兜底
          # 重试阶段更激进：5 次重试 × 30s 间隔
          CMD="python -u scripts/run_scan_pipeline.py --mode ${TIME_SLOT} --retries 5 --base-sleep 30"

          docker run --rm --name daily-push-retry \
            -e TUSHARE_TOKEN \
            -e SERVERCHAN_KEY \
            -e SERVERCHAN_KEY_BETA \
            -e WECHAT_APP_ID \
            -e WECHAT_APP_SECRET \
            -e WECHAT_TOKEN \
            -e WECHAT_ENCODING_AES_KEY \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            -e PUSH_API_KEY \
            -v "$GITHUB_WORKSPACE/results:/app/results" \
            -v "$GITHUB_WORKSPACE/logs:/app/logs" \
            tradingagents:daily-push \
            /bin/sh -lc "$CMD"

      - name: Upload retry results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: push-results-${{ steps.date.outputs.today }}-${{ needs.check-duplicate.outputs.time_slot }}
          path: results/daily/
          retention-days: 30

  alert-on-failure:
    name: Alert on persistent failure
    needs: [check-duplicate, daily-push, retry-push]
    if: (failure() || cancelled()) && needs.check-duplicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create failure alert issue
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const slot = '${{ needs.check-duplicate.outputs.time_slot }}';
            const slotLabel = slot === 'intraday' ? 'intraday' : slot === 'after_hours' ? 'after-hours' : 'unknown';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'push-failure,auto-alert',
              per_page: 50,
            });

            const existing = issues.data.find((issue) =>
              issue.title.includes(date) && issue.title.includes(slotLabel)
            );

            const body = [
              '## Daily push failure alert',
              '',
              `- Date: ${date}`,
              `- Time slot: ${slotLabel} (${slot})`,
              `- Run URL: ${runUrl}`,
              '',
              'Suggested checks:',
              '1. Review the workflow logs for the exact exception.',
              '2. Verify required GitHub Secrets such as TUSHARE_TOKEN and SERVERCHAN_KEY.',
              '3. Confirm the Docker image built successfully and the container could start.',
              '4. If this looks transient, trigger workflow_dispatch to retry manually.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Repeated failure detected.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Daily Push Failure] ${date} ${slotLabel}`,
                body,
                labels: ['push-failure', 'auto-alert'],
              });
            }

  close-alerts-on-success:
    name: Close stale alerts on success
    needs: [check-duplicate, daily-push]
    if: success() && needs.check-duplicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'push-failure,auto-alert',
              per_page: 20,
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Daily push recovered successfully. Closing this auto alert.',
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
