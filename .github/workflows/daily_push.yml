name: Daily Push

on:
  schedule:
    # 提前触发，确保扫描完成后准时投递
    # 盘中扫描: 北京时间12:30 = UTC 04:30 → 13:00准时到达微信
    - cron: '30 4 * * 1-5'
    # 盘后推送: 北京时间20:30 = UTC 12:30 → 21:00准时到达微信
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push)'
        required: false
        default: 'false'

jobs:
  daily-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Get current date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock data & OAMV cache
        uses: actions/cache@v4
        with:
          path: |
            results/stock_cache.duckdb
            results/oamv_cache
          key: stock-cache-v3-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            stock-cache-v3-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-warm data cache
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from classic_ta.stock_data_duckdb import get_cache_stats
          stats = get_cache_stats()
          print(f'Cache status: {stats.get(\"count\",0)} stocks, {stats.get(\"size_mb\",0)}MB')
          "

      - name: Run Daily Push
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERVERCHAN_KEY_BETA: ${{ secrets.SERVERCHAN_KEY_BETA }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python classic_ta/daily_push.py --dry-run
          else
            python -u classic_ta/daily_push.py
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-results-${{ steps.date.outputs.today }}
          path: results/daily/
          retention-days: 30
